<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2b2b" />
    <title>AR Cube</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- Start screen: 3D preview with the AR entry button -->
    <div id="home" class="home">
      <h1>AR Cube</h1>
      <p id="home-text" class="home-text">Checking AR support…</p>
      <button id="start-ar" class="btn btn-primary" hidden>Start AR</button>
      <!-- iOS AR Quick Look needs an <a rel="ar"> whose only child is an <img>. -->
      <a id="quicklook" rel="ar" download="cube.usdz" hidden>
        <img id="quicklook-img" alt="View in AR" />
      </a>
    </div>

    <!-- Shown on top of the camera while a WebXR AR session runs (Android). -->
    <div id="overlay" class="overlay" hidden>
      <div class="hint-wrap"><span id="hint" class="hint">Scanning…</span></div>
      <div class="toolbar">
        <button id="btn-undo" class="btn" disabled>Undo</button>
        <button id="btn-clear" class="btn" disabled>Clear</button>
        <button id="btn-exit" class="btn">Exit</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
