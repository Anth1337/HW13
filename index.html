<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2b2b" />
    <title>AR Pets</title>
  </head>
  <body>
    <!-- Camera mode (no WebXR): the live camera, behind the transparent 3D canvas. -->
    <video id="camera-video" class="camera-video" playsinline muted autoplay hidden></video>

    <div id="app"></div>

    <!-- Start screen (bottom sheet on phones, side panel on wide screens) over the 3D preview:
         the "My pets" slot menu (src/menu.ts) or the character creator for the active pet
         (src/creator.ts), and the deploy buttons. Starts in the centered "checking" state
         until main.ts knows which AR path to use. -->
    <div id="home" class="home checking">
      <header class="home-head">
        <h1>AR Pets</h1>
        <p id="home-text" class="home-text" role="status">Checking AR support…</p>
      </header>
      <section id="menu" class="menu" aria-label="My pets"></section>
      <button id="btn-back" type="button" class="cr-back" hidden>← My pets</button>
      <div id="creator" class="creator" aria-label="Customise your pet" hidden></div>
      <div id="home-actions" class="home-actions">
        <button id="btn-deploy" type="button" class="btn btn-primary" hidden>Deploy</button>
        <button id="btn-camera" type="button" class="btn" hidden>Camera mode</button>
        <!-- iOS AR Quick Look needs an <a rel="ar"> whose only child is an <img>. -->
        <a id="quicklook" rel="ar" download="dog.usdz" hidden><img id="quicklook-img" alt="View in AR" /></a>
      </div>
    </div>

    <!-- Shown on top of the camera while a WebXR AR session (Android) or camera mode runs
         (class "camera-mode" in camera mode). -->
    <div id="overlay" class="overlay" hidden>
      <canvas id="vision-canvas" class="vision-canvas" hidden></canvas>
      <div class="hint-wrap">
        <span id="hint" class="hint">Scanning…</span>
        <span id="status" class="status-chip" role="status" hidden></span>
      </div>
      <div id="ar-controls" class="ar-controls">
        <div class="ar-row ar-commands" role="group" aria-label="Commands">
          <button id="cmd-sit" type="button" class="btn btn-cmd" aria-pressed="false">Sit</button>
          <button id="cmd-lie" type="button" class="btn btn-cmd" aria-pressed="false">Lie down</button>
          <button id="cmd-come" type="button" class="btn btn-cmd">Come</button>
          <button id="cmd-mode" type="button" class="btn btn-cmd btn-mode">Follow</button>
        </div>
        <div class="ar-row ar-tricks" role="group" aria-label="Tricks">
          <button id="trick-rollOver" type="button" class="btn btn-trick">Roll over</button>
          <button id="trick-jump" type="button" class="btn btn-trick">Jump</button>
          <button id="trick-spin" type="button" class="btn btn-trick">Spin</button>
          <button id="btn-vision" type="button" class="btn btn-small" aria-pressed="false" aria-label="Show vision" title="Show what your pet sees">👁</button>
          <button id="btn-exit" type="button" class="btn btn-small btn-exit" aria-label="Exit" title="Exit">✕</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
